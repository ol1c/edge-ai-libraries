# Apply with ./configure-metrics.sh (requires an installed Metrics Manager package).
# true: enable; false: disable; auto: leave the current configuration unchanged.
# Missing options also mean auto. Values are lowercase, without quotes.

# Package/platform power from the separate RAPL service.
ENABLE_RAPL=auto
# Per-CPU frequency and temperature in the privileged powerstat collector.
ENABLE_POWERSTAT_EXTRA=auto
# Requires /usr/bin/turbostat and tools matching the running kernel.
ENABLE_TURBOSTAT=auto
# High-resolution temperature samples and min/max/mean aggregates.
ENABLE_TEMPERATURE=auto
# Per-device IRQ counters.
ENABLE_INTERRUPTS=auto
# Network traffic and NIC driver counters; review interface selection.
ENABLE_NETWORK=auto
# Filesystem usage and disk I/O; review mount point and device selection.
ENABLE_STORAGE=auto
